<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Verification - DILSHAJ INFOTECH</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="verify-container"><div class="verify-card">
<img src="assets/logo.svg" class="verify-logo" alt="DILSHAJ INFOTECH"><h1>Employee Verification</h1>

<div id="result" class="hidden"><div class="verified">✓ VERIFIED EMPLOYEE</div>
<img id="verifyPhoto" class="verify-photo" alt="Employee"><h2 id="verifyName"></h2>

<p><strong>Department:</strong> <span id="verifyDepartment"></span></p><p><strong>Status:</strong> <span id="verifyStatus"></span></p></div>
<div id="error" class="hidden error"></div></div></div>
<script src="js/config.js"></script><script src="js/verify.js"></script></body></html>
